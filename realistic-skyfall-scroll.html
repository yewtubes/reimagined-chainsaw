    ];
    const cloudsTex=CLOUD_IMAGES.map(src => {
      const img=new Image();img.onload=() => { active=true;start(); };img.src=src;
      return img;
    });
    const clouds=[];
    // Several separate banks of clouds, scattered around the camera's descent path.
    for(let i=0;i<133;i++){
      const z=between(260,10300);
      const nearPath=rand()<.12;
      const x=nearPath?between(-550,550):(rand()<.5?-1:1)*between(440,2050);
      const y=between(-1120,1100);
      const size=between(400,980)*((i%12===0)?1.8:1);
      clouds.push({x,y,z,size,depth:between(.67,1.12),texture:cloudsTex[Math.floor(rand()*cloudsTex.length)],haze:between(.65,.98)});
    }
    clouds.sort((a,b)=>b.z-a.z);
    const trails=[];
    for(let i=0;i<115;i++){
      trails.push({x:between(-1.7,1.7),y:between(-1.6,1.6),z:between(300,10400),size:between(.35,1.3)});
    }

    function resize(){
      w=window.innerWidth;h=window.innerHeight;
      // On high-DPI devices, cap the render scale to protect lower-end GPUs.
      dpr=Math.min(window.devicePixelRatio||1,1.6);
      canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      draw();
    }
    function getScroll(){
      const max=document.documentElement.scrollHeight-window.innerHeight;
      return max>0?clamp(window.scrollY/max,0,1):0;
    }
    function scroll(){target=getScroll();active=true;start()}
    window.addEventListener('scroll',scroll,{passive:true});
    window.addEventListener('resize',resize,{passive:true});
    window.addEventListener('pointermove',e=>{
      mouseX=((e.clientX/window.innerWidth)-.5)*2;
      mouseY=((e.clientY/window.innerHeight)-.5)*2;
      active=true;start();
    },{passive:true});

    function background(p){
      // Sky overhead, sun scattering and distant near-white atmospheric haze.
      const g=ctx.createLinearGradient(0,0,0,h);
      if(p<.40){
        g.addColorStop(0,'#619bc6');g.addColorStop(.44,'#95c3e3');g.addColorStop(1,'#e2eff7');
      }else{
        const u=smoothstep(.4,.9,p);
        g.addColorStop(0,`rgb(${Math.round(97+34*u)},${Math.round(155+26*u)},${Math.round(198+21*u)})`);
        g.addColorStop(.48,`rgb(${Math.round(149+32*u)},${Math.round(195+16*u)},${Math.round(227+8*u)})`);
        g.addColorStop(1,'#e9f1f6');
      }
      ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      const sunX=w*(.72+pointerX*.018),sunY=h*.09;
      const radius=Math.max(w,h)*.9;
      const sun=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,radius);
      sun.addColorStop(0,'rgba(255,252,235,.72)');sun.addColorStop(.07,'rgba(255,250,229,.39)');
      sun.addColorStop(.30,'rgba(248,249,241,.14)');sun.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=sun;ctx.fillRect(0,0,w,h);
    }
    function drawClouds(cam,blur){
      const focal=Math.max(w,h)*.89;
      const cx=w*.5-pointerX*25, cy=h*.49-pointerY*17;
      // Reverse Z ordering: far volumes first, near volumes last.
      for(let i=clouds.length-1;i>=0;i--){
        const c=clouds[i];
        const distance=c.z-cam;
        if(distance<50 || distance>3800)continue;
        const scale=focal/distance;
        const dx=(c.x-pointerX*130)*scale;
        const dy=(c.y-pointerY*95)*scale;
        const sz=c.size*scale;
        const sw=sz, sh=sz*.68*c.depth;
        const px=cx+dx-sw*.5,py=cy+dy-sh*.5;
        if(px>w+20||py>h+20||px+sw< -20||py+sh< -20)continue;
        const fog=clamp((3800-distance)/1450,0,1);
        const proximity=smoothstep(3800,500,distance);
        let opacity=clamp(fog*.84,0,.84)*c.haze;
        // Blue air perspective; distant clouds remain subtle.
        if(distance>1800)opacity*=lerp(1,.48,(distance-1800)/2000);
        if(distance<170)opacity*=distance/170;
        if(opacity<.004)continue;
        // Small motion smear exclusively during motion, matching flight direction.
        if(blur>.09 && distance<1400){
          ctx.globalAlpha=opacity*blur*.075;
          const off=clamp(blur*12*scale,0,20);
          if(c.texture.complete && c.texture.naturalWidth) ctx.drawImage(c.texture,px-dx*.014-off*.25,py-dy*.014-off*.65,sw,sh);
        }
        ctx.globalAlpha=opacity;
        if(c.texture.complete && c.texture.naturalWidth) ctx.drawImage(c.texture,px,py,sw,sh);
      }
      ctx.globalAlpha=1;
    }
    function drawStreaks(cam,blur){
      if(blur<.1)return;
      const strength=smoothstep(.1,.9,blur);
      const focal=Math.max(w,h)*.9;
      const ox=w*.5,oy=h*.5;
      ctx.lineCap='round';
      for(const t of trails){
        const dz=(t.z-cam+10000)%10000;
        if(dz<120||dz>1300)continue;
        const scale=focal/dz;
        const x=ox+t.x*650*scale,y=oy+t.y*500*scale;
        if(x<0||y<0||x>w||y>h)continue;
        const length=clamp(blur*scale*15,1,54)*t.size;
        const angle=Math.atan2(y-oy,x-ox);
        ctx.strokeStyle=`rgba(255,255,255,${clamp((1300-dz)/1300*strength*.27,0,.27)})`;
        ctx.lineWidth=clamp(scale*.8,.4,2.2);
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(angle)*length,y+Math.sin(angle)*length);ctx.stroke();
      }
    }
    function draw(){
      if(!w||!h)return;
      const progress=clamp(camera,0,1);
      const cam=progress*9100;
      const strength=clamp(Math.abs(velocity)*180,0,1);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      background(progress);
      drawClouds(cam,strength);
      drawStreaks(cam,strength);
      // Optical mist when the camera flies directly through cloud banks.
      let mist=0;
      for(let i=0;i<clouds.length;i++){
        const c=clouds[i];const dz=Math.abs(c.z-cam);
        if(dz>220||Math.abs(c.x)>640||Math.abs(c.y)>520)continue;
        mist+=smoothstep(220,0,dz)*smoothstep(680,0,Math.hypot(c.x,c.y))*.44;
      }
      if(mist>.005){
        ctx.fillStyle=`rgba(249,252,255,${Math.min(.85,mist)})`;
        ctx.fillRect(0,0,w,h);
      }
      // Barely perceptible edge softness of light scattering near the lens.
      const edge=ctx.createRadialGradient(w*.5,h*.42,Math.min(w,h)*.12,w*.5,h*.5,Math.max(w,h)*.9);
      edge.addColorStop(0,'rgba(255,255,255,0)');edge.addColorStop(1,'rgba(45,88,120,.10)');
      ctx.fillStyle=edge;ctx.fillRect(0,0,w,h);
    }
    function animate(){
      raf=0;
      const lag=reduceMotion?1:.095;
      const next=camera+(target-camera)*lag;
      velocity=next-camera;
      camera=Math.abs(target-next)<.000007?target:next;
      pointerX+=(mouseX-pointerX)*.045;
      pointerY+=(mouseY-pointerY)*.045;
      draw();
      if(Math.abs(camera-target)>.00001||Math.abs(mouseX-pointerX)>.004||Math.abs(mouseY-pointerY)>.004){
        start();
      }else if(Math.abs(velocity)>.0001){
        velocity*=.55;start();
      }else{velocity=0;active=false;}
    }
    function start(){if(!raf)raf=requestAnimationFrame(animate)}
    target=getScroll();camera=target;
    resize();start();
  })();
